; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Single environment: WiFi + serial control, no BLE.
default_envs = esp32dev

[env:esp32dev]
; pioarduino community platform - Arduino Core 3.x for ESP32.
; The official platformio/espressif32 platform is still pinned to core 2.0.x,
; so this fork is what provides 3.0. Same source as the crowpanel project.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; adds: pio run -t ota        (build + push over WiFi - no cable, no buttons)
;       pio run -t erasenvs   (wipe saved WiFi credentials + settings)
;       pio run -t eraseall   (full chip erase)
extra_scripts = pre:scripts/extra_targets.py

; Two 1.875MB app slots (ota_0/ota_1) so firmware can be replaced over the air.
; Firmware is ~1.07MB, about 54% of a slot. NVS stays at 0x9000/0x5000 - the
; same place huge_app.csv put it - so saved WiFi credentials and settings
; survive the switch. Changing this table needs ONE serial flash; after that
; updates go over WiFi.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_port = COM5
upload_speed = 460800

; This board (ESP32-D0WDQ6 on an FT232R) has NO auto-reset circuit, so esptool
; cannot pull it into the bootloader by toggling DTR/RTS. Before uploading:
;   hold BOOT/IO0, tap EN/RESET, release BOOT
; then upload, and press EN/RESET afterwards to run the sketch.
upload_flags =
    --before=no-reset
    --after=no-reset

lib_deps =
    ; MD_Parola was dropped: its PA_FLIP_LR does not work with the SCROLL_*
    ; effects this panel needs, so display_mgr.cpp drives MD_MAX72XX directly.
    majicdesigns/MD_MAX72XX@^3.5.1

; ---------------------------------------------------------------------------
; Over-the-air upload. Use this once the firmware below is running:
;   pio run -e esp32ota -t upload      (or: pio run -t ota)
; No BOOT/EN sequence, no cable. Falls back to [env:esp32dev] over serial if
; the device is unreachable or a bad image stops it joining WiFi.
; ---------------------------------------------------------------------------
[env:esp32ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ledpanel.local
upload_flags =
    --auth=ledpanel-ota
