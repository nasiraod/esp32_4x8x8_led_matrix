; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Single environment: WiFi + serial control, no BLE.
default_envs = esp32dev

[env:esp32dev]
; pioarduino community platform - Arduino Core 3.x for ESP32.
; The official platformio/espressif32 platform is still pinned to core 2.0.x,
; so this fork is what provides 3.0. Same source as the crowpanel project.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; adds: pio run -t erasenvs   (wipe saved WiFi credentials + settings)
;       pio run -t eraseall   (full chip erase)
extra_scripts = pre:scripts/extra_targets.py

; Single 3MB app slot, no OTA partitions. Firmware is ~1.05MB, so switching to
; min_spiffs.csv (two 1.875MB slots) is what OTA would need - see the OTA plan.
; That change requires one serial flash and wipes NVS, so it is deferred.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_port = COM5
upload_speed = 460800

; This board (ESP32-D0WDQ6 on an FT232R) has NO auto-reset circuit, so esptool
; cannot pull it into the bootloader by toggling DTR/RTS. Before uploading:
;   hold BOOT/IO0, tap EN/RESET, release BOOT
; then upload, and press EN/RESET afterwards to run the sketch.
upload_flags =
    --before=no-reset
    --after=no-reset

lib_deps =
    ; MD_Parola was dropped: its PA_FLIP_LR does not work with the SCROLL_*
    ; effects this panel needs, so display_mgr.cpp drives MD_MAX72XX directly.
    majicdesigns/MD_MAX72XX@^3.5.1

